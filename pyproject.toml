[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "google-maps-store-locator"
version = "1.0.0"
description = "Advanced Google Maps API Store Locator with nearest store proximity search, directions, real-time hours, ratings, and interactive map interface."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "breakingthebot"}
]
keywords = [
    "google-maps",
    "store-locator",
    "geocoding",
    "directions-api",
    "places-api",
    "fastapi",
    "geospatial",
    "haversine"
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "click>=8.1.7",
    "rich>=13.7.1",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
store-locator = "src.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
